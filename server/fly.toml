# Fly.io config for the baby monitor server (signaling + REST API in one process, TR7).
app = "babymonitor-server"
primary_region = "arn"

[build]

[env]
  DB_PATH = "/data/babymonitor.db"

[mounts]
  source = "babymonitor_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep exactly one machine running: rooms and WebSocket sessions live in memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
